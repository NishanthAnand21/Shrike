[package]
name = "shrike"
version = "0.1.0"
edition = "2021"
description = "Offensive-security recon-to-exploitation orchestration framework"

[[bin]]
name = "shrike"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "sync", "time", "fs", "signal"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
ipnet = "2"
quick-xml = "0.36"
indexmap = { version = "2", features = ["serde"] }
dirs = "5"
which = "6"
textwrap = "0.16"
base64 = "0.22"
portable-pty = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
